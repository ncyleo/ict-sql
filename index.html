<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一步一步學 SQL · 完整教程</title>
<style>
:root {
  --bg: #f1f5f9; --card: #fff; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
  --primary: #04AA6D; --primary-dark: #059669; --side: #282A35; --side-hover: #373b4d;
  --side-active: #04AA6D; --ok: #059669; --err: #dc2626; --code-bg: #1e293b; --code-fg: #e2e8f0;
  --accent: #7c3aed; --try: #e7f7ef; --radius: 8px;
  --font: "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono: "JetBrains Mono","Cascadia Code","SF Mono",Consolas,monospace;
  --side-w: 240px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6;
  display: flex; flex-direction: column; min-height: 100vh;
}
.topbar {
  background: #fff; border-bottom: 1px solid var(--line);
  padding: .65rem 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; z-index: 30;
}
.topbar h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
.topbar .badge { background: var(--primary); color: #fff; font-size: .72rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px; }
.topbar .tag { color: var(--muted); font-size: .85rem; flex: 1; min-width: 12rem; }
.menu-btn { display: none; appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: .35rem .6rem; font-weight: 700; cursor: pointer; }
.shell { display: flex; flex: 1; min-height: 0; }
.sidebar {
  width: var(--side-w); flex-shrink: 0; background: var(--side); color: #ddd;
  overflow-y: auto; padding: .5rem 0 1.5rem;
}
.sidebar .side-title {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
  color: #9ca3af; padding: .65rem 1rem .35rem; font-weight: 700;
}
.sidebar button {
  display: block; width: 100%; text-align: left; appearance: none; border: none; background: transparent;
  color: #ddd; font: inherit; font-size: .82rem; font-weight: 600;
  padding: .4rem 1rem; cursor: pointer; border-left: 4px solid transparent;
}
.sidebar button:hover { background: var(--side-hover); color: #fff; }
.sidebar button.active { background: var(--side-hover); color: #fff; border-left-color: var(--side-active); }
.sidebar button .mode-dot { float: right; width: .4rem; height: .4rem; border-radius: 50%; margin-top: .45rem; }
.sidebar button .mode-dot.live { background: #34d399; }
.sidebar button .mode-dot.demo { background: #fbbf24; }
.workspace { flex: 1; overflow-y: auto; padding: 1rem 1.15rem 2rem; max-width: 980px; }
.engine-bar { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-bottom: .75rem; }
.dot { width: .5rem; height: .5rem; border-radius: 50%; display: inline-block; }
.dot.on { background: var(--ok); } .dot.off { background: #f59e0b; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.15rem; margin-bottom: 1rem; }
.card h2 { margin: 0 0 .6rem; font-size: 1.35rem; }
.card h3 { margin: 1rem 0 .4rem; font-size: 1.05rem; color: #0f766e; border-left: 4px solid var(--primary); padding-left: .5rem; }
.teach p { margin: .45rem 0; }
.teach ul, .teach ol { margin: .35rem 0 .6rem; padding-left: 1.3rem; }
.kw { font-family: var(--mono); font-size: .86em; background: #ecfdf5; color: #047857; padding: .05rem .3rem; border-radius: 3px; font-weight: 600; }
.tip { background: #fffbeb; border-left: 4px solid #f59e0b; padding: .6rem .8rem; margin: .7rem 0; font-size: .9rem; }
.errbox { background: #fef2f2; border-left: 4px solid var(--err); padding: .6rem .8rem; margin: .7rem 0; font-size: .9rem; }
pre.sql { background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: .75rem .9rem; overflow-x: auto; font-family: var(--mono); font-size: .86rem; line-height: 1.5; margin: .45rem 0 .7rem; white-space: pre-wrap; word-break: break-word; }
.syntax-box { background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 6px; padding: .55rem .75rem; margin: .5rem 0; font-family: var(--mono); font-size: .84rem; }
.tryit { background: var(--try); border: 2px solid #a7f3d0; border-radius: var(--radius); padding: .9rem 1rem; margin-top: .5rem; }
.tryit h3 { margin: 0 0 .5rem; border: none; padding: 0; color: #065f46; font-size: 1.05rem; }
.tryit .try-note { font-size: .82rem; color: #047857; margin: 0 0 .55rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
button.btn { appearance: none; border: none; border-radius: 6px; padding: .5rem .95rem; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; }
button.btn-primary { background: var(--primary); color: #fff; }
button.btn-primary:hover { background: var(--primary-dark); }
button.btn-secondary { background: #334155; color: #fff; }
button.btn-ghost { background: #fff; border: 1px solid #94a3b8; color: var(--ink); }
button.snip { appearance: none; border: 1px solid #86efac; background: #fff; color: #065f46; padding: .28rem .5rem; border-radius: 4px; font-family: var(--mono); font-size: .74rem; font-weight: 600; cursor: pointer; }
button.snip:hover { background: #d1fae5; }
button.snip.ex { border-color: #a78bfa; color: #5b21b6; background: #faf5ff; }
button.snip.ex:hover { background: #ede9fe; }
.snippet-panel { margin: .4rem 0 .6rem; }
.snippet-panel .panel-label, .snippet-panel .sub-label { font-size: .78rem; color: var(--muted); margin: .35rem 0 .3rem; font-weight: 600; }
textarea.sql-input {
  width: 100%; min-height: 110px; resize: vertical; font-family: var(--mono); font-size: .88rem;
  border: 1px solid #86efac; border-radius: 6px; padding: .65rem; background: #fff; color: var(--ink); line-height: 1.45;
}
textarea.sql-input:focus { outline: 2px solid rgba(4,170,109,.4); }
.status { font-size: .86rem; margin: .35rem 0; min-height: 1.2em; }
.status.ok { color: var(--ok); } .status.err { color: var(--err); } .status.info { color: var(--muted); }
.table-wrap { overflow-x: auto; margin: .4rem 0; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
table.data { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.data th, table.data td { padding: .4rem .55rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { background: #f1f5f9; font-weight: 700; }
.sample-note { font-size: .82rem; color: var(--muted); margin: 0 0 .4rem; }
details.ref-box { margin: .7rem 0 0; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; padding: .3rem .7rem .5rem; }
details.ref-box summary { cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--muted); padding: .3rem 0; list-style: none; }
details.ref-box summary::-webkit-details-marker { display: none; }
details.ref-box summary::before { content: "▸ "; color: var(--primary); }
details.ref-box[open] summary::before { content: "▾ "; }
details.ref-box .ref-note { font-size: .8rem; color: var(--muted); margin: .2rem 0 .4rem; }
.insert-flash { outline: 2px solid rgba(4,170,109,.5); }
.footer-note { text-align: center; color: var(--muted); font-size: .78rem; padding: .5rem 1rem 1.2rem; }
.pill { display: inline-block; background: #d1fae5; color: #065f46; font-size: .72rem; font-weight: 700; padding: .12rem .45rem; border-radius: 999px; vertical-align: middle; }
.pill.demo { background: #fef3c7; color: #92400e; }
.legend { font-size: .75rem; color: #9ca3af; padding: .2rem 1rem .5rem; }
@media (max-width: 900px) {
  .menu-btn { display: inline-block; }
  .sidebar { display: none; position: absolute; z-index: 40; height: calc(100% - 52px); top: 52px; left: 0; box-shadow: 4px 0 20px rgba(0,0,0,.25); }
  .sidebar.open { display: block; }
}
</style>
</head>
<body>
<div class="topbar">
  <button type="button" class="menu-btn" id="menuBtn" aria-label="選單">目錄</button>
  <h1>一步一步學 SQL</h1>
  <span class="badge">ICT</span>
  <span class="tag">W3Schools 式完整目錄 · 左選課題 → 短講解 → 點範例插入 → Try it → 執行（綠點＝即時查詢／黃點＝示範結果）</span>
</div>
<div class="shell">
<aside class="sidebar" id="navSteps" aria-label="課題清單"></aside>
<main class="workspace">
  <div class="engine-bar" id="engineBar">
    <span class="dot off" id="engineDot"></span>
    <span id="engineMsg">正在準備 SQL 引擎…</span>
  </div>
  <div id="lessonRoot"></div>
</main>
</div>
<p class="footer-note">一步一步學 SQL · CLUBMEMBER + CLUB · 離線可用 · 內容自寫（唔抄 W3Schools 原文）</p>
<script src="app.js"></script>
</body>
</html>
